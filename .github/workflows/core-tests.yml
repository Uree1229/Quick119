name: core-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Python runtime
        env:
          PBS_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20260825/cpython-3.12.14%2B20260825-x86_64-unknown-linux-gnu-install_only.tar.gz
          PBS_SHA256: cbdd2f0cf02f941bc5c81e546f377275e322733abffe805ac29d2b7e8a58f7e3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" "$PBS_URL"
          echo "$PBS_SHA256  $RUNNER_TEMP/python.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m pip install -r quick119-pwa/requirements.txt -r requirements/requirements-server.txt
      - run: python3 -m unittest discover -s tests/core
      - name: PWA Python tests
        env:
          PYTHONPATH: .:..
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd quick119-pwa
          python3 -m unittest discover -s tests -p 'test_intake*.py'
          python3 -m unittest discover -s tests -p 'test_seoul_demo.py'
      - name: PWA and hospital JavaScript tests
        run: node --test quick119-pwa/tests/test_chat_intake.mjs tests/browser/test_hospital_*.mjs
